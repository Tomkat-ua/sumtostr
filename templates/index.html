<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #B0C4DE;
        }
        .card-custom {
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            background: #ffffff;
        }
        .btn-primary, .btn-secondary {
            border-radius: 12px;
        }
        label {
            font-weight: 600;
        }

        /* CSS для збільшення розміру перемикача */
        .form-switch-lg .form-check-input {
            width: 3.5em; /* Збільшуємо ширину (наприклад, з 2em до 3.5em) */
            height: 1.75em; /* Збільшуємо висоту */
            /* Додатково: зміщуємо елемент, щоб він виглядав рівно */
            margin-right: 0.5em;
        }

        /* Коригуємо позицію кнопки, щоб вона була посередині */
        .form-switch-lg .form-check-label {
            padding-top: 0.25em; /* Невелика корекція, якщо потрібно */
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="card card-custom mx-auto" style="max-width: 600px;">
        <h3 class="text-center mb-4">{{ title }}</h3>

    <form method="post" action="/post" enctype="multipart/form-data" class="row g-3">
      {#  <div class="form-check form-switch form-switch-lg">
          <input class="form-check-input"
                 type="checkbox"
                 role="switch"
                 id="bigSwitch"
                 name="is_active_mode"
                 value="on">
                 <label class="form-check-label" for="bigSwitch">Активний режим</label>
        </div>#}

            <div class="col-12">
                <label class="form-label">Сума числом:</label>
                <input class="form-control form-control-lg"
                       type="number" step="0.01"
                       id="user_input"
                       name="user_data" required
                       value="{{ num_value }}">
            </div>

            <div class="col-12 d-grid">
                <button class="btn btn-primary btn-lg" type="submit">Перетворити</button>
            </div>

            <div class="col-12">
                <label class="form-label">Сума прописом:</label>
                <textarea class="form-control"
                          id="str_value"
                          readonly
                          rows="3">{{ str_value }}</textarea>
            </div>

            <div class="col-12 d-grid">
                <button class="btn btn-secondary btn-lg" type="button" onclick="copyInputToClipboard('str_value')">Копіювати</button>
            </div>
        </form>
        <footer>
    <p>
        &copy; 2025 Розробник <a href="http://resume.tomkat.in" target="_blank">VK aka Tomkat</a>.
    </p>
</footer>
    </div>
</div>

<script>
function fallbackCopyTextToClipboard(inputElement) {
    const valueToCopy = inputElement.value;
    let textArea = document.createElement("textarea");

    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    textArea.value = valueToCopy;

    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
        const successful = document.execCommand('copy');
        return successful;
    } catch (err) {
        return false;
    } finally {
        document.body.removeChild(textArea);
    }
}

function copyInputToClipboard(elementId) {
    const inputElement = document.getElementById(elementId);
    if (!inputElement) return;
    const valueToCopy = inputElement.value;

    if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(valueToCopy)
            .catch(() => fallbackCopyTextToClipboard(inputElement));
    } else {
        fallbackCopyTextToClipboard(inputElement);
    }
    alert("Значення скопійовано в буфер 📋");
}
</script>
</body>




<script>
/**
 * Резервний метод для копіювання тексту з readonly поля
 * через тимчасовий елемент.
 */
function fallbackCopyTextToClipboard(inputElement) {
    const valueToCopy = inputElement.value;
    let textArea = document.createElement("textarea");

    // Розміщуємо textarea за межами екрана
    textArea.style.position = 'fixed';
    textArea.style.opacity = '0';
    textArea.value = valueToCopy;

    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select(); // Виділяємо текст

    try {
        const successful = document.execCommand('copy');
        if (successful) {
            console.log('Значення успішно скопійовано резервним методом.');
            return true;
        } else {
            console.error('Не вдалося скопіювати резервним методом.');
            return false;
        }
    } catch (err) {
        console.error('Не вдалося скопіювати резервним методом:', err);
        return false;
    } finally {
        // Видаляємо тимчасовий елемент
        document.body.removeChild(textArea);
    }
}


function copyInputToClipboard(elementId) {
    const inputElement = document.getElementById(elementId);

    if (!inputElement) {
        console.error(`Елемент з ID '${elementId}' не знайдено.`);
        return; // Повертаємо, оскільки це не Promise в даному випадку
    }
    const valueToCopy = inputElement.value;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        // 🌟 Головний метод
        navigator.clipboard.writeText(valueToCopy)
            .then(() => {
                console.log('Значення успішно скопійовано у буфер обміну.');
            })
            .catch(err => {
                console.error('Помилка копіювання через безпеку/дозволи:', err);
                // Якщо API не спрацювало (наприклад, через дозволи), спробуємо резервний
                fallbackCopyTextToClipboard(inputElement);
            });
    } else {
        // Резервний метод
        fallbackCopyTextToClipboard(inputElement);
    }
    alert("Значення скопійовано в буфер 📋");
}
</script>


</html>
